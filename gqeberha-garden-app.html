   Shared tokens, helpers

const COLORS = {

const HEALTH_LEVELS = [
  { key: "thriving", label: "Thriving", color: "#5C8A4A" },
  { key: "healthy", label: "Healthy", color: "#7C8A6E" },
  { key: "stressed", label: "Stressed", color: "#C08A34" },
  { key: "struggling", label: "Struggling", color: "#A8562E" },
];
function healthMeta(key) {
  return HEALTH_LEVELS.find((h) => h.key === key) || HEALTH_LEVELS[1];
}
function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}
function todayLabel() {
  return new Date().toLocaleDateString("en-ZA", { weekday: "long", day: "numeric", month: "long" });
}
function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

/* ===========================================================
   Storage helpers — shared across Home + Tracker screens.
   Uses Claude's window.storage when this runs inside a Claude.ai
   artifact preview, and falls back to plain localStorage when
   installed standalone (home screen / any other browser) —
   which is the normal case once this is out of the chat preview.
=========================================================== */
const storage = (typeof window !== "undefined" && window.storage) ? window.storage : {
  async get(key) {
    try {
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v };
    } catch { return null; }
  },
  async set(key, value) {
    localStorage.setItem(key, value); // let quota/errors throw so callers can surface them
    return { key, value };
  },
  async delete(key) {
    try { localStorage.removeItem(key); return { key, deleted: true }; } catch { return null; }
  },
};

async function loadIndex() {
  try {
    const res = await storage.get("plant-index");
    return res ? JSON.parse(res.value) : [];
  } catch { return []; }
}
async function saveIndex(index) {
  await storage.set("plant-index", JSON.stringify(index));
}
async function loadPlant(id) {
  try {
    const res = await storage.get(`plant:${id}`);
    return res ? JSON.parse(res.value) : null;
  } catch { return null; }
}
async function savePlant(plant) {
  await storage.set(`plant:${plant.id}`, JSON.stringify(plant));
}
function newPlant(name) {
  return {
    id: uid(), name, health: "healthy", lastWatered: null, plantedDate: null,
    pests: [], logs: [], notes: "", varieties: [],
  };
}
function compressImage(file, maxDim = 640, quality = 0.8) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => resolve(reader.result); // fall back to the original if resizing fails
      img.src = reader.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}
async function exportGardenData() {
  const index = await loadIndex();
  const plants = await Promise.all(index.map((p) => loadPlant(p.id)));
  const payload = { exportedAt: new Date().toISOString(), plants: plants.filter(Boolean) };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `gqeberha-garden-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function WeatherIcon({ kind }) {
  const stroke = COLORS.ink;

function useLiveWeather(lat, lon) {
  const [state, setState] = useState({ loading: true, error: null, data: null });
  useEffect(() => {
    let cancelled = false;
    async function load() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,precipitation_probability&timezone=auto`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("Weather request failed");
        const json = await res.json();
        if (!cancelled) {
          setState({
            loading: false, error: null,
            data: {
              temp: Math.round(json.current.temperature_2m),
              code: json.current.weather_code,
              rainChance: json.current.precipitation_probability,
            },
          });
        }
      } catch (err) {
        if (!cancelled) setState({ loading: false, error: err.message, data: null });
      }
    }
    load();
    return () => { cancelled = true; };
  }, [lat, lon]);
  return state;
}

/* ===========================================================
   Harvest watch — reads the live plant-index the Tracker writes
=========================================================== */
const HARVEST_GUIDE = [
  { crop: "Tomatoes", keywords: ["tomato"], months: [11, 0, 1, 2], daysToMaturity: [70, 85], lookFor: "Fully coloured and slightly soft to a gentle squeeze — twist off rather than pull." },
  { crop: "Peppers & chillies", keywords: ["pepper", "chilli", "chili", "capsicum"], months: [0, 1, 2, 3], daysToMaturity: [75, 90], lookFor: "Skin glossy and firm; colour deepens further the longer they hang." },
  { crop: "Cucumbers", keywords: ["cucumber"], months: [10, 11, 0, 1, 2], daysToMaturity: [50, 70], lookFor: "Firm and deep green — pick before any yellowing starts." },
  { crop: "Beans", keywords: ["bean"], months: [10, 11, 0, 1, 2], daysToMaturity: [55, 65], lookFor: "Pods snap crisply and seeds are barely visible through the skin." },

  { crop: "Squash & marrows", keywords: ["squash", "marrow", "zucchini", "courgette", "pumpkin"], months: [10, 11, 0, 1, 2, 3], daysToMaturity: [50, 60], lookFor: "Skin still tender for marrows; let storage squash harden fully first." },
  { crop: "Basil", keywords: ["basil"], months: [10, 11, 0, 1, 2, 3], daysToMaturity: [60, 70], lookFor: "Pinch leaves before flower buds open for the best flavour." },
  { crop: "Spinach & Swiss chard", keywords: ["spinach", "chard"], months: [2, 3, 4, 5, 6, 7, 8], daysToMaturity: [40, 50], lookFor: "Pick outer leaves once hand-sized so the centre keeps producing." },
  { crop: "Beetroot", keywords: ["beetroot", "beet"], months: [3, 4, 5, 6, 7], daysToMaturity: [55, 65], lookFor: "Shoulders showing above the soil, roughly golf- to tennis-ball size." },
  { crop: "Carrots", keywords: ["carrot"], months: [4, 5, 6, 7, 8], daysToMaturity: [70, 80], lookFor: "Shoulders visible at the soil surface with good colour and width." },
  { crop: "Broccoli", keywords: ["broccoli"], months: [5, 6, 7, 8], daysToMaturity: [80, 100], lookFor: "Head tight and dark green — harvest before any yellow flowers show." },
  { crop: "Cabbage", keywords: ["cabbage"], months: [5, 6, 7, 8], daysToMaturity: [70, 100], lookFor: "Head feels firm and dense when pressed." },
  { crop: "Cauliflower", keywords: ["cauliflower"], months: [5, 6, 7], daysToMaturity: [80, 100], lookFor: "Curd compact and creamy-white, before it loosens or discolours." },
  { crop: "Kale", keywords: ["kale"], months: [4, 5, 6, 7, 8], daysToMaturity: [55, 75], lookFor: "Leaves hand-sized and dark green; pick the lower leaves first." },
  { crop: "Onion", keywords: ["onion"], months: [7, 8, 9], daysToMaturity: [100, 130], lookFor: "Necks soften and the tops flop over and start to dry off." },
  { crop: "Garlic", keywords: ["garlic"], months: [9, 10], daysToMaturity: [150, 180], lookFor: "Lower leaves brown while a few upper leaves are still green." },
  { crop: "Peas", keywords: ["pea"], months: [6, 7, 8], daysToMaturity: [60, 70], lookFor: "Pods feel full and firm; pick often to keep plants producing." },
  { crop: "Broad beans", keywords: ["broad bean"], months: [6, 7, 8], daysToMaturity: [90, 100], lookFor: "Pods glossy and firm with beans showing as bumps, not yet leathery." },
  { crop: "Turnips", keywords: ["turnip"], months: [4, 5, 6, 7], daysToMaturity: [45, 60], lookFor: "Roots at golf- to tennis-ball size — pull before they turn woody." },
  { crop: "Leeks", keywords: ["leek"], months: [9, 10, 11], daysToMaturity: [120, 150], lookFor: "Stems reach finger to thumb thickness; can stay in the ground until needed." },
];
function findHarvestEntry(plantName) {
  const name = plantName.toLowerCase();
  return HARVEST_GUIDE.find((entry) => entry.keywords.some((k) => name.includes(k)));
}
function timingLabel(monthsUntil) {
  if (monthsUntil === 0) return { text: "Harvesting now", color: "#5C8A4A" };
  if (monthsUntil === 1) return { text: "Ready next month", color: "#7C8A6E" };
  return { text: `Approaching in ${monthsUntil} months`, color: "#C08A34" };
}
function dayTimingLabel(daysUntilMin, daysUntilMax) {
  if (daysUntilMin <= 0 && daysUntilMax >= 0) return { text: "Harvesting now", color: "#5C8A4A" };
  if (daysUntilMin <= 7) return { text: `Ready in ${daysUntilMin} day${daysUntilMin === 1 ? "" : "s"}`, color: "#7C8A6E" };
  if (daysUntilMin <= 60) return { text: `Ready in ~${Math.round(daysUntilMin / 7)} weeks`, color: "#C08A34" };
  return { text: `Ready in ~${Math.round(daysUntilMin / 30)} months`, color: "#C08A34" };
}
function monthsUntilHarvest(harvestMonths, currentMonth) {
  let best = 12;
  for (const m of harvestMonths) {
    const diff = (m - currentMonth + 12) % 12;
    if (diff < best) best = diff;
  }
  return best;
}
const POLL_MS = 5000;

function useGardenPlants(pollMs = POLL_MS, versionDep) {
  const [plants, setPlants] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    let cancelled = false;
    async function refresh() {
      const idx = await loadIndex();
      const full = await Promise.all(idx.map((p) => loadPlant(p.id)));
      if (!cancelled) { setPlants(full.filter(Boolean)); setLoading(false); }
    }
    refresh();
    const interval = setInterval(refresh, pollMs);
    return () => { cancelled = true; clearInterval(interval); };
  }, [pollMs, versionDep]);
  return { plants, loading };
}

function HarvestWatch({ maxItems = 4, plantIndexVersion }) {
  const { plants: trackedPlants, loading } = useGardenPlants(POLL_MS, plantIndexVersion);

  const upcoming = useMemo(() => {
    const now = Date.now();
    const currentMonth = new Date().getMonth();
    return trackedPlants
      .map((p) => {
        const entry = findHarvestEntry(p.name);
        if (!entry) return null;
        if (p.plantedDate) {
          const [minDays, maxDays] = entry.daysToMaturity;
          const daysUntilMin = Math.ceil((p.plantedDate + minDays * 86400000 - now) / 86400000);
          const daysUntilMax = Math.ceil((p.plantedDate + maxDays * 86400000 - now) / 86400000);
          return {
            plantId: p.id, plantName: p.name, lookFor: entry.lookFor,
            sortKey: daysUntilMin, personalized: true, daysUntilMin, daysUntilMax,
          };
        }
        return {
          plantId: p.id, plantName: p.name, lookFor: entry.lookFor,
          sortKey: monthsUntilHarvest(entry.months, currentMonth) * 30,
          personalized: false, monthsUntil: monthsUntilHarvest(entry.months, currentMonth),
        };
      })
      .filter((item) => item && item.sortKey <= 60)
      .sort((a, b) => a.sortKey - b.sortKey || a.plantName.localeCompare(b.plantName))
      .slice(0, maxItems);
  }, [trackedPlants, maxItems]);

  const unmatchedCount = trackedPlants.length - trackedPlants.filter((p) => findHarvestEntry(p.name)).length;

  return (
    <div style={{
      background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 14,
      padding: "16px 16px 14px", maxWidth: 460,
    }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 12 }}>
        <h2 style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: 17, fontWeight: 600, margin: 0 }}>Harvest watch</h2>
        <span style={{ fontSize: 11.5, color: COLORS.inkSoft }}>Your garden</span>
      </div>

      {loading && <div style={{ fontSize: 13, color: COLORS.inkSoft }}>Checking your garden…</div>}
      {!loading && trackedPlants.length === 0 && (
        <div style={{ fontSize: 13, color: COLORS.inkSoft }}>Add plant groups in the Tracker tab to see their harvest timing here.</div>
      )}
      {!loading && trackedPlants.length > 0 && upcoming.length === 0 && (
        <div style={{ fontSize: 13, color: COLORS.inkSoft }}>Nothing in your garden is due for harvest in the next couple of months.</div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {upcoming.map((item) => {
          const timing = item.personalized
            ? dayTimingLabel(item.daysUntilMin, item.daysUntilMax)
            : timingLabel(item.monthsUntil);
          return (
            <div key={item.plantId} style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: "10px 12px" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                <span style={{ fontSize: 14, fontWeight: 600 }}>{item.plantName}</span>
                <span style={{ fontSize: 11, fontWeight: 600, color: "#fff", background: timing.color, padding: "3px 9px", borderRadius: 999, whiteSpace: "nowrap" }}>
                  {timing.text}
                </span>
              </div>
              <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginTop: 5, lineHeight: 1.4 }}>{item.lookFor}</div>
              {!item.personalized && (
                <div style={{ fontSize: 11, color: COLORS.inkSoft, marginTop: 4, fontStyle: "italic" }}>
                  Add a planting date in Tracker for a precise estimate.
                </div>
              )}
            </div>
          );
        })}
      </div>

      {!loading && unmatchedCount > 0 && (
        <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 10 }}>
          {unmatchedCount} tracked plant{unmatchedCount > 1 ? "s" : ""} without harvest data yet.
        </div>
      )}
    </div>
  );
}

/* ===========================================================
   Watering reminders — homepage glance at what's due for water
=========================================================== */
const WATER_REMINDER_DAYS = 3;

function WateringReminders({ plantIndexVersion }) {
  const { plants, loading } = useGardenPlants(POLL_MS, plantIndexVersion);
  const [busyId, setBusyId] = useState(null);

  const needsWater = useMemo(() => {
    const now = Date.now();
    return plants
      .map((p) => {
        const daysSince = p.lastWatered ? Math.floor((now - p.lastWatered) / 86400000) : null;
        return { ...p, daysSince };
      })
      .filter((p) => p.daysSince === null || p.daysSince >= WATER_REMINDER_DAYS)
      .sort((a, b) => (b.daysSince ?? 999) - (a.daysSince ?? 999));
  }, [plants]);

  async function handleQuickWater(plant) {
    setBusyId(plant.id);
    await savePlant({ ...plant, lastWatered: Date.now() });
    setBusyId(null);
  }

  if (loading || needsWater.length === 0) return null;

  return (
    <div style={{
      background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 14,
      padding: "14px 16px", maxWidth: 460, marginBottom: 18,
    }}>
      <h2 style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: 15, fontWeight: 600, margin: "0 0 10px", color: COLORS.clay }}>
        Needs watering
      </h2>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {needsWater.map((p) => (
          <div key={p.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
            <span style={{ fontSize: 13.5 }}>
              {p.name} <span style={{ color: COLORS.inkSoft, fontSize: 12 }}>
                — {p.daysSince === null ? "never logged" : `${p.daysSince}d ago`}
              </span>
            </span>
            <button onClick={() => handleQuickWater(p)} disabled={busyId === p.id} style={btnGhostLocal}>
              {busyId === p.id ? "…" : "Log watering"}
            </button>
          </div>
        ))}
      </div>
    </div>
  );
}
const btnGhostLocal = { background: "transparent", border: "1px solid #5B6350", color: "#5B6350", borderRadius: 999, padding: "4px 10px", fontSize: 12, cursor: "pointer", whiteSpace: "nowrap" };

/* ===========================================================
   Home screen — combines weather/planting + harvest watch
=========================================================== */
function HomeScreen({ plantIndexVersion }) {
  return (
    <div style={{ padding: "20px 18px 90px" }}>
      <div style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 13, color: COLORS.inkSoft }}>{todayLabel()}</div>
        <h1 style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: 24, margin: "4px 0 0", fontWeight: 600 }}>
          Gqeberha garden
        </h1>
      </div>
      <div style={{ marginBottom: 18 }}>
        <WateringReminders plantIndexVersion={plantIndexVersion} />
      </div>
      <TodaysWeatherCard />
      <div style={{ marginTop: 22 }}>
        <HarvestWatch plantIndexVersion={plantIndexVersion} />

/* ===========================================================
   Tracker screen — full GrowthTracker feature
=========================================================== */
const inputStyle = { width: "100%", padding: "9px 12px", borderRadius: 8, border: `1px solid ${COLORS.line}`, fontSize: 13.5, fontFamily: "inherit", boxSizing: "border-box" };
const labelStyle = { fontSize: 13, color: COLORS.inkSoft, marginBottom: 6, display: "block" };
const btnPrimary = { background: COLORS.sage, color: "#fff", border: "none", borderRadius: 8, padding: "8px 16px", fontSize: 13.5, cursor: "pointer" };
const btnGhost = { background: "transparent", border: `1px solid ${COLORS.inkSoft}`, color: COLORS.inkSoft, borderRadius: 999, padding: "5px 12px", fontSize: 12.5, cursor: "pointer" };

function Section({ title, children }) {
  return (
    <div style={{ background: COLORS.card, border: `1px solid ${COLORS.line}`, borderRadius: 14, padding: "16px 16px", marginBottom: 16 }}>
      <h2 style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: 16, fontWeight: 600, margin: "0 0 12px" }}>{title}</h2>
      {children}
    </div>
  );
}

function TrackerScreen({ onPlantsChanged }) {
  const [index, setIndex] = useState([]);
  const [activeId, setActiveId] = useState(null);
  const [plant, setPlant] = useState(null);
  const [loading, setLoading] = useState(true);
  const [addingPlant, setAddingPlant] = useState(false);
  const [newPlantName, setNewPlantName] = useState("");
  const [addPlantError, setAddPlantError] = useState(null);

  const [checkHealth, setCheckHealth] = useState("healthy");
  const [checkWatered, setCheckWatered] = useState(false);
  const [checkPestNote, setCheckPestNote] = useState("");
  const [checkNote, setCheckNote] = useState("");

  const [addingPest, setAddingPest] = useState(false);
  const [pestObs, setPestObs] = useState("");
  const [pestTreatment, setPestTreatment] = useState("");

  const [notesDraft, setNotesDraft] = useState("");
  const [notesSaved, setNotesSaved] = useState(true);

  const [addingVariety, setAddingVariety] = useState(false);
  const [varietyName, setVarietyName] = useState("");
  const [varietyImage, setVarietyImage] = useState(null);
  const [varietyImageUrl, setVarietyImageUrl] = useState("");
  const [varietyBusy, setVarietyBusy] = useState(false);

  const [renaming, setRenaming] = useState(false);
  const [renameDraft, setRenameDraft] = useState("");
  const [confirmingDelete, setConfirmingDelete] = useState(false);

  useEffect(() => {
    (async () => {
      const idx = await loadIndex();
      setIndex(idx);
      if (idx.length) setActiveId(idx[0].id);
      setLoading(false);
    })();
  }, []);

  useEffect(() => {
    if (!activeId) { setPlant(null); return; }
    (async () => {
      const p = await loadPlant(activeId);
      const withDefaults = p ? { ...p, varieties: p.varieties || [] } : null;
      setPlant(withDefaults);
      setCheckHealth(p ? p.health : "healthy");
      setNotesDraft(p ? p.notes : "");
      setNotesSaved(true);
      setAddingVariety(false);
      setVarietyName(""); setVarietyImage(null); setVarietyImageUrl("");
      setRenaming(false); setConfirmingDelete(false);
    })();
  }, [activeId]);

  const refreshPlant = useCallback(async (updated) => {
    setPlant(updated);
    await savePlant(updated);
  }, []);

  async function handleAddPlant() {
    const name = newPlantName.trim();
    if (!name) return;
    setAddPlantError(null);
    try {
      const p = newPlant(name);
      await savePlant(p);
      const newIndex = [...index, { id: p.id, name: p.name }];
      setIndex(newIndex);
      await saveIndex(newIndex);
      setNewPlantName(""); setAddingPlant(false); setActiveId(p.id);
      onPlantsChanged();
    } catch (err) {
      setAddPlantError("Couldn't save that plant — " + (err && err.message ? err.message : "storage error") + ". Try again, or free up space if storage is full.");
    }
  }

  async function handleDeletePlant(id) {
    const newIndex = index.filter((p) => p.id !== id);
    setIndex(newIndex);
    await saveIndex(newIndex);
    if (activeId === id) setActiveId(newIndex.length ? newIndex[0].id : null);
    setConfirmingDelete(false);
    onPlantsChanged();
  }

  async function handleLogWaterToday() {
    if (!plant) return;
    await refreshPlant({ ...plant, lastWatered: Date.now() });
  }

  async function handleSetPlantedDate(dateStr) {
    if (!plant) return;
    const ts = dateStr ? new Date(dateStr + "T00:00:00").getTime() : null;
    await refreshPlant({ ...plant, plantedDate: ts });
  }

  async function handleRenamePlant() {
    const name = renameDraft.trim();
    if (!plant || !name) return;
    await refreshPlant({ ...plant, name });
    const newIndex = index.map((p) => (p.id === plant.id ? { ...p, name } : p));
    setIndex(newIndex);
    await saveIndex(newIndex);
    setRenaming(false);
    onPlantsChanged();
  }

  async function handleAddPest() {
    if (!plant || !pestObs.trim()) return;
    const entry = { id: uid(), observation: pestObs.trim(), treatment: pestTreatment.trim(), dateAdded: Date.now() };
    await refreshPlant({ ...plant, pests: [...plant.pests, entry] });
    setPestObs(""); setPestTreatment(""); setAddingPest(false);
  }

  async function handleResolvePest(id) {
    if (!plant) return;
    await refreshPlant({ ...plant, pests: plant.pests.filter((p) => p.id !== id) });
  }

  async function handleSaveCheckIn() {
    if (!plant) return;
    const entry = { id: uid(), date: Date.now(), health: checkHealth, watered: checkWatered, pestNote: checkPestNote.trim(), note: checkNote.trim() };
    await refreshPlant({
      ...plant, health: checkHealth,
      lastWatered: checkWatered ? Date.now() : plant.lastWatered,
      logs: [entry, ...plant.logs],
    });
    setCheckWatered(false); setCheckPestNote(""); setCheckNote("");
  }

  async function handleSaveNotes() {
    if (!plant) return;
    await refreshPlant({ ...plant, notes: notesDraft });
    setNotesSaved(true);
  }

  async function handleVarietyFileChange(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setVarietyBusy(true);
    try {
      const compressed = await compressImage(file);
      setVarietyImage(compressed); setVarietyImageUrl("");
    } catch {}
    setVarietyBusy(false);
  }

  async function handleAddVariety() {
    if (!plant || !varietyName.trim()) return;
    const entry = { id: uid(), name: varietyName.trim(), image: varietyImage || varietyImageUrl.trim() || null };
    await refreshPlant({ ...plant, varieties: [...(plant.varieties || []), entry] });
    setVarietyName(""); setVarietyImage(null); setVarietyImageUrl(""); setAddingVariety(false);
  }

  async function handleDeleteVariety(id) {
    if (!plant) return;
    await refreshPlant({ ...plant, varieties: (plant.varieties || []).filter((v) => v.id !== id) });
  }

  const daysAgo = (ts) => {
    if (!ts) return "Not logged";
    const days = Math.floor((Date.now() - ts) / 86400000);
    if (days <= 0) return "Today";
    if (days === 1) return "Yesterday";
    return `${days} days ago`;
  };

  return (
    <div style={{ padding: "20px 18px 90px" }}>
      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 13, color: COLORS.inkSoft }}>{todayLabel()}</div>
        <h1 style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: 24, margin: "4px 0 0", fontWeight: 600 }}>Growth tracker</h1>
      </div>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 18 }}>
        {index.map((p) => (
          <button key={p.id} onClick={() => setActiveId(p.id)} style={{
            border: `1px solid ${p.id === activeId ? COLORS.sage : COLORS.line}`,
            background: p.id === activeId ? COLORS.sage : COLORS.card,
            color: p.id === activeId ? "#fff" : COLORS.ink,
            borderRadius: 999, padding: "7px 14px", fontSize: 13.5, cursor: "pointer",
          }}>
            {p.name}
          </button>
        ))}
        {!addingPlant && (
          <button onClick={() => setAddingPlant(true)} style={{ border: `1px dashed ${COLORS.inkSoft}`, background: "transparent", color: COLORS.inkSoft, borderRadius: 999, padding: "7px 14px", fontSize: 13.5, cursor: "pointer" }}>
            + Add plant group
          </button>
        )}
      </div>

      {addingPlant && (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 18 }}>
          <div style={{ display: "flex", gap: 8 }}>
            <input autoFocus value={newPlantName} onChange={(e) => setNewPlantName(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && handleAddPlant()}
              placeholder="e.g. Tomatoes — Bed 1" style={inputStyle} />
            <button onClick={handleAddPlant} style={btnPrimary}>Add</button>
          </div>
          {addPlantError && <div style={{ fontSize: 12.5, color: COLORS.danger }}>{addPlantError}</div>}
        </div>
      )}

      {loading && <div style={{ color: COLORS.inkSoft }}>Loading your garden…</div>}
      {!loading && !index.length && !addingPlant && (
        <div style={{ color: COLORS.inkSoft, fontSize: 14 }}>No plant groups yet — add one above to start tracking.</div>
      )}

      {plant && (
        <React.Fragment>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
            {renaming ? (
              <div style={{ display: "flex", gap: 8, flex: 1 }}>
                <input
                  autoFocus
                  value={renameDraft}
                  onChange={(e) => setRenameDraft(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && handleRenamePlant()}
                  style={inputStyle}
                />
                <button onClick={handleRenamePlant} style={btnPrimary}>Save</button>
                <button onClick={() => setRenaming(false)} style={btnGhost}>Cancel</button>
              </div>
            ) : (
              <React.Fragment>
                <h2 style={{ fontFamily: "'Fraunces', Georgia, serif", fontSize: 19, fontWeight: 600, margin: 0 }}>{plant.name}</h2>
                <button onClick={() => { setRenaming(true); setRenameDraft(plant.name); }} style={btnGhost}>Rename</button>
              </React.Fragment>
            )}
          </div>

          <Section title="Current status">
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
              <span style={{ fontSize: 14, color: COLORS.inkSoft }}>Planted on</span>
              <input
                type="date"
                value={plant.plantedDate ? new Date(plant.plantedDate).toISOString().slice(0, 10) : ""}
                onChange={(e) => handleSetPlantedDate(e.target.value)}
                style={{ ...inputStyle, width: "auto", padding: "6px 10px", fontSize: 13 }}
              />
            </div>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
              <span style={{ fontSize: 14, color: COLORS.inkSoft }}>Health</span>
              <span style={{ fontSize: 13, fontWeight: 600, color: "#fff", background: healthMeta(plant.health).color, padding: "4px 12px", borderRadius: 999 }}>
                {healthMeta(plant.health).label}
              </span>
            </div>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
              <span style={{ fontSize: 14, color: COLORS.inkSoft }}>Last watered</span>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 13.5 }}>{daysAgo(plant.lastWatered)}</span>
                <button onClick={handleLogWaterToday} style={btnGhost}>Log watering</button>
              </div>
            </div>

            <div style={{ marginTop: 4 }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <span style={{ fontSize: 14, color: COLORS.inkSoft }}>Active pest issues</span>
                {!addingPest && <button onClick={() => setAddingPest(true)} style={btnGhost}>+ Report</button>}
              </div>
              {plant.pests.length === 0 && !addingPest && (
                <div style={{ fontSize: 13, color: COLORS.inkSoft, marginTop: 6 }}>None observed</div>
              )}
              {plant.pests.map((p) => (
                <div key={p.id} style={{ marginTop: 8, background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: "10px 12px" }}>
                  <div style={{ fontSize: 13.5 }}>{p.observation}</div>
                  {p.treatment && <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginTop: 3 }}>Treatment: {p.treatment}</div>}
                  <button onClick={() => handleResolvePest(p.id)} style={{ ...btnGhost, marginTop: 8 }}>Mark resolved</button>
                </div>
              ))}
              {addingPest && (
                <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 8 }}>
                  <input placeholder="What did you observe?" value={pestObs} onChange={(e) => setPestObs(e.target.value)} style={inputStyle} />
                  <input placeholder="Treatment applied (optional)" value={pestTreatment} onChange={(e) => setPestTreatment(e.target.value)} style={inputStyle} />
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={handleAddPest} style={btnPrimary}>Save</button>
                    <button onClick={() => setAddingPest(false)} style={btnGhost}>Cancel</button>
                  </div>
                </div>
              )}
            </div>
          </Section>

          <Section title="Varieties">
            {(!plant.varieties || plant.varieties.length === 0) && !addingVariety && (
              <div style={{ fontSize: 13, color: COLORS.inkSoft, marginBottom: 10 }}>
                No varieties logged yet — e.g. "Roma" or "Black Krim" for tomatoes.
              </div>
            )}
            {plant.varieties && plant.varieties.length > 0 && (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(110px, 1fr))", gap: 10, marginBottom: addingVariety ? 14 : 0 }}>
                {plant.varieties.map((v) => (
                  <div key={v.id} style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, overflow: "hidden" }}>
                    <div style={{ width: "100%", aspectRatio: "1 / 1", background: COLORS.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
                      {v.image ? (
                        <img src={v.image} alt={v.name} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                      ) : (
                        <span style={{ fontSize: 11, color: COLORS.inkSoft }}>No image</span>
                      )}
                    </div>
                    <div style={{ padding: "7px 8px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6 }}>
                      <span style={{ fontSize: 12.5 }}>{v.name}</span>
                      <button onClick={() => handleDeleteVariety(v.id)} style={{ background: "none", border: "none", color: COLORS.inkSoft, cursor: "pointer", fontSize: 14, lineHeight: 1 }}>×</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
            {!addingVariety && <button onClick={() => setAddingVariety(true)} style={btnGhost}>+ Add variety</button>}
            {addingVariety && (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                <input placeholder="Variety name (e.g. Roma)" value={varietyName} onChange={(e) => setVarietyName(e.target.value)} style={inputStyle} />
                <label style={{ ...labelStyle, marginBottom: 0 }}>Photo</label>
                <input type="file" accept="image/*" onChange={handleVarietyFileChange} style={{ fontSize: 12.5 }} />
                {varietyBusy && <div style={{ fontSize: 12, color: COLORS.inkSoft }}>Compressing photo…</div>}
                <div style={{ fontSize: 12, color: COLORS.inkSoft }}>or paste an image URL</div>
                <input placeholder="https://…" value={varietyImageUrl} onChange={(e) => { setVarietyImageUrl(e.target.value); setVarietyImage(null); }} style={inputStyle} />
                {(varietyImage || varietyImageUrl) && (
                  <img src={varietyImage || varietyImageUrl} alt="Preview" style={{ width: 72, height: 72, objectFit: "cover", borderRadius: 8, border: `1px solid ${COLORS.line}` }} />
                )}
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={handleAddVariety} style={btnPrimary}>Save variety</button>
                  <button onClick={() => { setAddingVariety(false); setVarietyName(""); setVarietyImage(null); setVarietyImageUrl(""); }} style={btnGhost}>Cancel</button>
                </div>
              </div>
            )}
          </Section>

          <Section title="Add a check-in">
            <label style={labelStyle}>Health today</label>
            <div style={{ display: "flex", gap: 6, marginBottom: 12, flexWrap: "wrap" }}>
              {HEALTH_LEVELS.map((h) => (
                <button key={h.key} onClick={() => setCheckHealth(h.key)} style={{
                  border: `1px solid ${checkHealth === h.key ? h.color : COLORS.line}`,
                  background: checkHealth === h.key ? h.color : "#fff",
                  color: checkHealth === h.key ? "#fff" : COLORS.ink,
                  borderRadius: 999, padding: "6px 12px", fontSize: 13, cursor: "pointer",
                }}>
                  {h.label}
                </button>
              ))}
            </div>
            <label style={{ ...labelStyle, display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
              <input type="checkbox" checked={checkWatered} onChange={(e) => setCheckWatered(e.target.checked)} />
              Watered today
            </label>
            <input placeholder="Insects/pests observed (optional)" value={checkPestNote} onChange={(e) => setCheckPestNote(e.target.value)} style={{ ...inputStyle, marginTop: 10 }} />
            <textarea placeholder="Any other notes for this check-in (optional)" value={checkNote} onChange={(e) => setCheckNote(e.target.value)} rows={2} style={{ ...inputStyle, marginTop: 10, resize: "vertical" }} />
            <button onClick={handleSaveCheckIn} style={{ ...btnPrimary, marginTop: 10 }}>Save check-in</button>
          </Section>

          <Section title="History">
            {plant.logs.length === 0 && <div style={{ fontSize: 13, color: COLORS.inkSoft }}>No check-ins logged yet.</div>}
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {plant.logs.map((entry) => (
                <div key={entry.id} style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: "10px 12px" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span style={{ fontSize: 12.5, color: COLORS.inkSoft }}>
                      {new Date(entry.date).toLocaleDateString("en-ZA", { day: "numeric", month: "short" })}
                    </span>
                    <span style={{ fontSize: 11.5, fontWeight: 600, color: "#fff", background: healthMeta(entry.health).color, padding: "2px 9px", borderRadius: 999 }}>
                      {healthMeta(entry.health).label}
                    </span>
                  </div>
                  <div style={{ fontSize: 13, marginTop: 6, color: COLORS.ink }}>
                    {entry.watered ? "Watered" : "Not watered"}
                    {entry.pestNote && ` · Pests: ${entry.pestNote}`}
                  </div>
                  {entry.note && <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginTop: 4 }}>{entry.note}</div>}
                </div>
              ))}
            </div>
          </Section>

          <Section title="Notes">
            <textarea value={notesDraft} onChange={(e) => { setNotesDraft(e.target.value); setNotesSaved(false); }}
              placeholder="General notes for this plant group — varieties, placement, reminders…" rows={4} style={{ ...inputStyle, resize: "vertical" }} />
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 8 }}>
              <button onClick={handleSaveNotes} style={btnPrimary} disabled={notesSaved}>Save notes</button>
              <span style={{ fontSize: 12.5, color: COLORS.inkSoft }}>{notesSaved ? "Saved" : "Unsaved changes"}</span>
            </div>
          </Section>

          {confirmingDelete ? (
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 4 }}>
              <span style={{ fontSize: 12.5, color: COLORS.danger }}>Delete "{plant.name}" and all its history?</span>
              <button onClick={() => handleDeletePlant(plant.id)} style={{ ...btnGhost, color: "#fff", background: COLORS.danger, borderColor: COLORS.danger }}>
                Yes, delete
              </button>
              <button onClick={() => setConfirmingDelete(false)} style={btnGhost}>Cancel</button>
            </div>
          ) : (
            <button onClick={() => setConfirmingDelete(true)} style={{ ...btnGhost, color: COLORS.danger, borderColor: COLORS.danger, marginTop: 4 }}>
              Remove this plant group
            </button>
          )}
        </React.Fragment>
      )}

      {!loading && index.length > 0 && (
        <div style={{ marginTop: 24, paddingTop: 14, borderTop: `1px solid ${COLORS.line}` }}>
          <button onClick={exportGardenData} style={btnGhost}>Export garden data (JSON)</button>
        </div>
      )}
    </div>
  );
}

/* ===========================================================
   App shell — bottom nav between Home and Tracker
=========================================================== */
function NavIcon({ kind, active }) {
  const color = active ? COLORS.sage : COLORS.inkSoft;
  if (kind === "home") {
    return (
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M4 11 L12 4 L20 11 V20 H14 V14 H10 V20 H4 Z" stroke={color} strokeWidth="1.8" strokeLinejoin="round" fill="none" />
      </svg>
    );
  }
  return (
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M12 20 V10" stroke={color} strokeWidth="1.8" strokeLinecap="round" />
      <path d="M12 12 C12 7 8 6 5 6 C5 10 7 12 12 12 Z" fill={color} opacity="0.85" />
      <path d="M12 10 C12 6 16 5 19 5 C19 9 16 11 12 10 Z" fill={color} opacity="0.55" />
    </svg>
  );
}

function FileProtocolWarning() {
  return (
    <div style={{
      background: "#FBEFE8", border: `1px solid ${COLORS.clay}`, borderRadius: 12,
      padding: "12px 14px", margin: "14px 18px 0", fontSize: 12.5, color: COLORS.ink, lineHeight: 1.5,
    }}>
      <strong style={{ color: COLORS.clay }}>Saving is disabled right now.</strong> This page was opened as a local
      file, and browsers block on-device storage for local files. Host this file online (even a free static host)
      and open it from that https:// link instead — then saving will work normally.
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("home");
  const [plantIndexVersion, setPlantIndexVersion] = useState(0);
  const isFileProtocol = typeof window !== "undefined" && window.location.protocol === "file:";

  return (
    <div style={{ minHeight: "100vh", background: COLORS.bg, fontFamily: "'Work Sans', system-ui, sans-serif", color: COLORS.ink }}>
      {isFileProtocol && <FileProtocolWarning />}
      <div style={{ maxWidth: 460, margin: "0 auto" }}>
        {tab === "home"
          ? <HomeScreen plantIndexVersion={plantIndexVersion} />
          : <TrackerScreen onPlantsChanged={() => setPlantIndexVersion((v) => v + 1)} />}
      </div>

      <div style={{
        position: "fixed", left: 0, right: 0, bottom: 0,
        background: COLORS.card, borderTop: `1px solid ${COLORS.line}`,
        display: "flex", justifyContent: "center",
        paddingBottom: "env(safe-area-inset-bottom, 0px)",
      }}>
        <div style={{ display: "flex", width: "100%", maxWidth: 460 }}>
          {[{ key: "home", label: "Home" }, { key: "tracker", label: "Tracker" }].map((t) => (
            <button key={t.key} onClick={() => setTab(t.key)} style={{
              flex: 1, background: "none", border: "none", padding: "10px 0 8px",
              display: "flex", flexDirection: "column", alignItems: "center", gap: 3, cursor: "pointer",
            }}>
              <NavIcon kind={t.key} active={tab === t.key} />
              <span style={{ fontSize: 11.5, color: tab === t.key ? COLORS.sage : COLORS.inkSoft, fontWeight: tab === t.key ? 600 : 400 }}>
                {t.label}
              </span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
